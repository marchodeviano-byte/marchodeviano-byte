<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;text-anchor:middle}
.mono{font-family:'Courier New',Consolas,monospace;font-size:11px;fill:#38bdf8;letter-spacing:1.5px}
.cw,.ccw,.bar,.pulse{transform-box:fill-box;transform-origin:center}
@keyframes cw{to{transform:rotate(360deg)}}
@keyframes ccw{to{transform:rotate(-360deg)}}
.cw.s{animation:cw 14s linear infinite}.ccw.s{animation:ccw 14s linear infinite}
.cw.m{animation:cw 9s linear infinite}.ccw.m{animation:ccw 9s linear infinite}
.cw.f{animation:cw 6s linear infinite}.ccw.f{animation:ccw 6s linear infinite}
.cw.l{animation:cw 40s linear infinite}.ccw.l{animation:ccw 30s linear infinite}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.25);opacity:1}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.bar{transform-origin:bottom;animation:bar 1.3s ease-in-out infinite}
@keyframes scan{from{transform:translateY(-30px)}to{transform:translateY(340px)}}
.scan{animation:scan 4.5s linear infinite}
@keyframes blink{50%{opacity:.2}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes pop{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.t{animation:pop 1s ease-out both}.t2{animation:pop 1s .4s ease-out both}.t3{animation:pop 1s .8s ease-out both}
</style>
